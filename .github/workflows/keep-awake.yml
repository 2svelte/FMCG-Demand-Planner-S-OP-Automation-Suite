name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  # Allows you to run it manually to test right now
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto('https://automated-demand-planner.streamlit.app/', timeout=60000)
              page.wait_for_timeout(15000)
              # Click the 'Yes, get this app back up!' button if it happens to be asleep
              wake_button = page.locator('button:has-text(\"Yes, get this app back up!\")')
              if wake_button.is_visible():
                  wake_button.click()
                  page.wait_for_timeout(20000)
              browser.close()
          "
